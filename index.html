<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NK 약술논술 AI 케어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ══════════ 미리보기 배너 (원장이 학생·학부모 화면을 열었을 때만) ══════════ -->
<div id="previewStrip" class="preview-strip no-print" style="display:none">
  <span id="previewLabel"></span>
  <button id="previewExit" class="preview-exit">관리자로 돌아가기</button>
</div>

<!-- ══════════ 로그인 ══════════ -->
<div id="loginView">
  <div class="login-card">
    <div class="brand"><span id="loginLogo"></span><b>NK 약술논술 AI 케어</b></div>
    <p class="sub">학원 학습관리 시스템</p>
    <div id="cfgBanner" class="banner-warn" style="display:none">Supabase 설정이 필요합니다 — README_설치가이드.md 참조</div>
    <div id="cdnBanner" class="banner-warn" style="display:none">인터넷 연결이 필요합니다 (외부 라이브러리 로드 실패)</div>
    <label for="loginPhone">전화번호</label>
    <input id="loginPhone" type="tel" inputmode="numeric" placeholder="01012345678" autocomplete="username" />
    <label for="loginPw">비밀번호</label>
    <input id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password" />
    <button id="loginBtn" class="btn-primary">로그인</button>
    <div id="loginErr" class="login-err"></div>
    <div class="demo-hint">둘러보기: 주소 끝에 <b>?demo=1</b> 을 붙여 여세요.</div>
  </div>
</div>

<!-- ══════════ 앱 셸 (관리자/학생) ══════════ -->
<div id="appView">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brandbox">
        <span class="logo-badge" id="sideLogo"></span>
        <div><b>NK 약술논술</b><small>AI 케어</small></div>
        <button id="sideClose" class="side-close" aria-label="메뉴 닫기">✕</button>
      </div>
      <nav class="nav" id="navMenu"></nav>
      <div class="side-foot">
        <div class="side-user"><span class="av" id="userAv">관</span><div id="userLabel">관리자</div></div>
        <button class="logout-btn" id="logoutBtn"><span id="logoutIcon"></span>로그아웃</button>
      </div>
    </aside>
    <div id="sideBackdrop"></div>
    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center">
          <button class="menu-toggle" id="menuToggle"></button>
          <div><h2 id="pageTitle">대시보드</h2><div class="crumb" id="pageCrumb"></div></div>
        </div>
        <div id="topRight"></div>
      </header>
      <div class="content">
        <div id="globalErr" class="globalerr"></div>
        <div id="tabContent"></div>
      </div>
      <div id="demoStrip" class="demo-strip no-print" style="display:none">데모 모드 · 내장 샘플 데이터로 표시 중입니다. 실제 저장은 되지 않습니다.</div>
    </main>
  </div>
</div>

<!-- ══════════ 학부모 화면 (모바일 우선) ══════════ -->
<div id="parentView">
  <div class="p-head">
    <div style="display:flex;align-items:center;gap:10px"><span class="logo-badge" id="pLogo"></span><b style="font-size:14px">NK 약술논술 AI 케어</b></div>
    <div id="pTop"></div>
  </div>
  <div class="p-wrap" id="parentWrap"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<!-- KaTeX: 문제은행 화면의 수식 미리보기 전용. 로드만 하고 렌더는 problems.js 에서 호출한다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
